<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sản phẩm - DVK Gunpla</title>
  <link rel="icon" href="images/logo.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="products">
  <div id="site-header"></div>

  <main class="container page">
    <nav class="breadcrumb" id="breadcrumb"></nav>
    <div class="page-title">
      <div><h1 id="list-title">Tất cả sản phẩm</h1><p id="list-subtitle">Mô hình Gundam chính hãng và dụng cụ lắp ráp</p></div>
    </div>

    <div class="card result-bar">
      <p id="result-count"></p>
      <div class="sort">
        <a class="link" href="advanced-search.html" id="adv-link">Tìm kiếm nâng cao</a>
        <span class="sort-sep"></span>
        Sắp xếp:
        <select class="select" id="sort">
          <option value="default">Mặc định</option>
          <option value="best">Bán chạy nhất</option>
          <option value="price-asc">Giá: thấp đến cao</option>
          <option value="price-desc">Giá: cao đến thấp</option>
          <option value="new">Hàng mới về</option>
        </select>
      </div>
    </div>
    <div class="active-filters" id="active-filters"></div>
    <div class="product-grid" id="product-list"></div>
    <div id="pagination"></div>
  </main>

  <div id="site-footer"></div>

  <script src="js/data.js"></script>
  <script src="js/common.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/products.js"></script>
</body>
</html>
