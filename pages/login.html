<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập - Frame & Form</title>
  <link rel="icon" href="../assets/images/frame-form.svg">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body data-page="login" data-root="../">
  <div id="site-header"></div>

  <main class="container page">
    <div class="auth-wrap">
      <div class="auth-art">
        <span class="auth-eyebrow">FRAME &amp; FORM</span>
        <div class="auth-art-card"><img src="../assets/images/products/sazabi-verka.jpg" alt="Hình minh họa mô hình trưng bày"></div>
        <h2>Chào mừng bạn trở lại!</h2>
        <p>Đăng nhập để đặt hàng, lưu địa chỉ và theo dõi lịch sử mua hàng của bạn.</p>
      </div>
      <!-- Không ràng buộc: không required, không kiểm tra định dạng -->
      <form class="auth-form" id="login-form" autocomplete="off" novalidate>
        <span class="eyebrow">Tài khoản khách hàng</span>
        <h1>Đăng nhập</h1>
        <p>Chưa có tài khoản? <a class="link" href="register.html">Đăng ký ngay</a></p>
        <label class="field"><span>Email hoặc số điện thoại</span>
          <div class="input-icon"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg><input class="input" id="login-email" placeholder="Nhập email hoặc số điện thoại"></div>
        </label>
        <label class="field"><span>Mật khẩu</span>
          <div class="input-icon"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><input class="input" id="login-password" type="password" placeholder="Nhập mật khẩu"></div>
        </label>
        <div class="auth-row">
          <label><input type="checkbox" checked> Ghi nhớ đăng nhập</label>
          <a class="link" href="#" id="forgot">Quên mật khẩu?</a>
        </div>
        <button class="btn btn-primary btn-lg btn-block" type="submit">Đăng nhập</button>
      </form>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/common.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script>
    // Bị chuyển đến từ trang cần đăng nhập: báo cho khách biết lý do
    const target = loginRedirectTarget();
    if (target) toast("Vui lòng đăng nhập", `Đăng nhập để xem ${target.label}`, "info");

    document.getElementById("login-form").addEventListener("submit", function (e) {
      e.preventDefault();
      setLoggedIn(true);
      const email = document.getElementById("login-email").value.trim();
      const redirect = target ? target.href : "../index.html";
      toastThenGo(redirect, "Đăng nhập thành công", email ? "Xin chào " + escapeHtml(email) + "!" : "Chào mừng bạn quay lại Frame & Form!");
    });
    document.getElementById("forgot").addEventListener("click", function (e) {
      e.preventDefault();
      toast("Đã gửi hướng dẫn đặt lại mật khẩu", "Vui lòng kiểm tra email của bạn", "info");
    });
  </script>
</body>
</html>
