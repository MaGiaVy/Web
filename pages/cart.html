<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giỏ hàng - DVK Gunpla</title>
  <link rel="icon" href="../assets/images/logo.svg">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body data-page="cart" data-root="../" class="cosmos-universe-body">
  <!-- Lớp thiên thể vũ trụ (Mặt Trời, Trái Đất) -->
  <div class="celestial-orbit-overlay" aria-hidden="true">
    <div class="solar-flare-beacon"></div>
    <div class="earth-marble"></div>
  </div>

  <div id="site-header"></div>

  <main class="container page">
    <nav class="breadcrumb"><a href="../index.html">Trang chủ</a><span>›</span><b>Giỏ hàng</b></nav>
    <div class="steps">
      <div class="step current"><span>1</span> Giỏ hàng</div>
      <div class="step-line"></div>
      <div class="step"><span>2</span> Thông tin đặt hàng</div>
      <div class="step-line"></div>
      <div class="step"><span>3</span> Hoàn tất</div>
    </div>

    <div class="cart-layout">
      <section class="card">
        <div class="card-head"><h2 id="cart-title">Giỏ hàng của bạn</h2><a class="link" href="products.html">← Tiếp tục mua sắm</a></div>
        <div class="table-wrap">
          <table class="table">
            <thead><tr><th>Sản phẩm</th><th class="right">Đơn giá</th><th class="center">Số lượng</th><th class="right">Thành tiền</th><th></th></tr></thead>
            <tbody id="cart-body"></tbody>
          </table>
        </div>
      </section>

      <aside class="card summary">
        <div class="card-head"><h3>Tóm tắt đơn hàng</h3></div>
        <div class="summary-body">
          <div class="summary-row"><span>Tạm tính (<span id="sum-count">0</span> sản phẩm)</span><b id="sum-sub">0đ</b></div>
          <div class="summary-row"><span>Phí vận chuyển</span><b id="sum-ship">0đ</b></div>
          <div class="summary-total"><span>Tổng cộng</span><b id="sum-total">0đ</b></div>
          <div class="summary-note" id="ship-note"></div>
          <a class="btn btn-primary btn-lg btn-block" id="go-checkout" href="checkout.html">Tiến hành đặt hàng</a>
        </div>
      </aside>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/common.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script src="../assets/js/cart.js"></script>
</body>
</html>
