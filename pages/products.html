
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sản phẩm - DVK Gunpla</title>
  <link rel="icon" href="../assets/images/logo.svg">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body data-page="products" data-root="../" class="cosmos-universe-body">
  <!-- Lớp thiên thể vũ trụ (Mặt Trời, Trái Đất) -->
  <div class="celestial-orbit-overlay" aria-hidden="true">
    <div class="solar-flare-beacon"></div>
    <div class="earth-marble"></div>
  </div>

  <div id="site-header"></div>

  <main class="container page">
    <nav class="breadcrumb" id="breadcrumb"></nav>
    <div class="page-title">
      <div><h1 id="list-title">Tất cả sản phẩm</h1><p id="list-subtitle">Mô hình Gundam chính hãng và dụng cụ lắp ráp</p></div>
    </div>

    <div class="card result-bar" style="justify-content:flex-start">
      <div class="sort">
        <a class="btn btn-outline btn-sm" href="advanced-search.html" id="adv-link"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg> Bộ lọc nâng cao</a>
        <span class="sort-sep"></span>
        Sắp xếp:
        <select class="select" id="sort">
          <option value="default">Mặc định</option>
          <option value="best">Bán chạy nhất</option>
          <option value="price-asc">Giá: thấp đến cao</option>
          <option value="price-desc">Giá: cao đến thấp</option>
          <option value="new">Hàng mới về</option>
        </select>
        <span class="sort-sep"></span>
        <p id="result-count"></p>
      </div>
    </div>
    <div class="active-filters" id="active-filters"></div>
    <div class="product-grid" id="product-list"></div>
    <div id="pagination"></div>
  </main>

  <div id="site-footer"></div>

  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/common.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script src="../assets/js/products.js"></script>
</body>
</html>
