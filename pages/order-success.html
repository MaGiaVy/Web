<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đặt hàng thành công - DVK Gunpla</title>
  <link rel="icon" href="../assets/images/logo.svg">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body data-page="order-success" data-root="../" class="cosmos-universe-body">
  <!-- Lớp thiên thể vũ trụ (Mặt Trời, Trái Đất) -->
  <div class="celestial-orbit-overlay" aria-hidden="true">
    <div class="solar-flare-beacon"></div>
    <div class="earth-marble"></div>
  </div>

  <div id="site-header"></div>

  <main class="container page">
    <div class="steps">
      <div class="step done"><span>✓</span> Giỏ hàng</div>
      <div class="step-line done"></div>
      <div class="step done"><span>✓</span> Thông tin đặt hàng</div>
      <div class="step-line done"></div>
      <div class="step done"><span>✓</span> Hoàn tất</div>
    </div>

    <div class="detail-layout">
      <section class="card">
        <div class="success-hero" id="success-hero"></div>
        <div class="card-head"><h3>Sản phẩm đã đặt</h3></div>
        <div id="success-items"></div>
      </section>
      <aside class="checkout-stack">
        <section class="card">
          <div class="card-head"><h3>Thông tin giao hàng</h3></div>
          <div class="info-list" id="success-info"></div>
        </section>
        <section class="card" id="success-totals"></section>
      </aside>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/common.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script>
    // Hiển thị đơn hàng vừa đặt (đơn mẫu đã được lưu sẵn trong dữ liệu)
    (function () {
      const order = getOrder(LAST_ORDER_ID);
      document.getElementById("success-hero").innerHTML = `
        <div class="success-icon">${icon("check")}</div>
        <h1>Đặt hàng thành công!</h1>
        <p>Cảm ơn bạn đã mua sắm tại DVK Gunpla. Đơn hàng đã được lưu và đang chờ cửa hàng xác nhận.</p>
        <div class="order-code">Mã đơn hàng: <b>#${order.id}</b></div>
        <div class="success-actions">
          <a class="btn btn-dark" href="order-detail.html?id=${order.id}">${icon("orders")} Xem chi tiết đơn hàng</a>
          <a class="btn btn-outline" href="orders.html">Lịch sử mua hàng</a>
          <a class="btn btn-outline" href="products.html">Tiếp tục mua sắm</a>
        </div>`;
      document.getElementById("success-items").innerHTML = orderItemsTable(order);
      document.getElementById("success-info").innerHTML = `
        <div class="info-row">${icon("user")}<div><small>Người nhận</small><b>${order.address.receiver} - ${order.address.phone}</b></div></div>
        <div class="info-row">${icon("map")}<div><small>Địa chỉ</small><b>${fullAddress(order.address)}</b></div></div>
        <div class="info-row">${icon("wallet")}<div><small>Thanh toán</small><b>${PAYMENT_METHODS[order.payment]}</b></div></div>
        <div class="info-row">${icon("clock")}<div><small>Thời gian đặt</small><b>${formatDateTime(order.datetime)}</b></div></div>
        <div class="info-row">${icon("info")}<div><small>Trạng thái</small>${statusChip(order.status)}</div></div>`;
      document.getElementById("success-totals").innerHTML = orderTotalsBox(order);
      toast("Đơn hàng đã được lưu", `Mã đơn #${order.id}`);
    })();
  </script>
</body>
</html>
