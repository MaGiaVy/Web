<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý đơn hàng - Quản trị DVK Gunpla</title>
  <link rel="icon" href="../images/logo.svg">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin" data-root="../" data-admin-page="orders" data-title="Quản lý đơn hàng" data-crumb="Đơn hàng">
  <div class="admin-shell">
    <div id="admin-sidebar"></div>
    <div class="admin-main">
      <div id="admin-topbar"></div>
      <main class="admin-content">
        <!-- Lọc: tình trạng / khoảng thời gian / địa điểm giao hàng -->
        <form class="card toolbar" id="order-filter" autocomplete="off">
          <label class="field"><span>Tìm mã đơn / khách hàng</span>
            <div class="search-input"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input class="input" id="of-key" placeholder="Vd: DH2610..."></div>
          </label>
          <label class="field"><span>Tình trạng</span><select class="select" id="of-status"></select></label>
          <label class="field"><span>Từ ngày</span><input class="input" type="date" id="of-from"></label>
          <label class="field"><span>Đến ngày</span><input class="input" type="date" id="of-to"></label>
          <label class="field"><span>Thành phố</span><select class="select" id="of-city"></select></label>
          <label class="field"><span>Quận / Huyện</span><select class="select" id="of-district"></select></label>
          <div class="toolbar-actions">
            <button class="btn btn-outline" type="button" id="of-reset">Đặt lại</button>
            <button class="btn btn-dark" type="submit" id="of-submit"></button>
          </div>
          <div class="toolbar-note" id="of-note"></div>
        </form>

        <section class="card">
          <div class="table-wrap"><table class="table">
            <thead><tr><th>Mã đơn</th><th>Khách hàng</th><th>Ngày đặt</th><th style="min-width:130px">Giao đến</th><th class="right">Tổng tiền</th><th>Trạng thái</th><th>Cập nhật trạng thái</th><th></th></tr></thead>
            <tbody id="order-body"></tbody>
          </table></div>
          <div class="table-foot" id="order-foot"></div>
        </section>
      </main>
    </div>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/admin/admin-layout.js"></script>
  <script src="../js/admin/orders.js"></script>
</body>
</html>
