<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chi tiết đơn hàng - Quản trị DVK Gunpla</title>
  <link rel="icon" href="../assets/images/logo.svg">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body class="admin" data-root="../" data-admin-page="orders" data-title="Chi tiết đơn hàng" data-crumb="Đơn hàng / Chi tiết">
  <div class="admin-shell">
    <div id="admin-sidebar"></div>
    <div class="admin-main">
      <div id="admin-topbar"></div>
      <main class="admin-content">
        <div class="page-title" style="margin:0">
          <div><h1 id="od-title" style="font-size:24px"></h1><p id="od-sub"></p></div>
          <div style="display:flex;gap:10px" id="od-actions"></div>
        </div>
        <!-- Trái: tiến trình + sản phẩm và tổng tiền (như hóa đơn). Phải: xử lý, khách hàng, giao hàng, thanh toán -->
        <div class="detail-layout od-layout">
          <div class="checkout-stack">
            <section class="card" id="od-timeline"></section>
            <section class="card">
              <div class="card-head"><h3>Sản phẩm trong đơn</h3></div>
              <div id="od-items"></div>
              <div class="od-totals" id="od-totals"></div>
            </section>
          </div>
          <aside class="checkout-stack">
            <section class="card" id="od-status"></section>
            <section class="card"><div class="card-head"><h3>Thông tin đơn hàng</h3></div><div id="od-info"></div></section>
          </aside>
        </div>
      </main>
    </div>
  </div>

  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/common.js"></script>
  <script src="../assets/js/admin/admin-layout.js"></script>
  <script src="../assets/js/admin/order-detail.js"></script>
</body>
</html>
