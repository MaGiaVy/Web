<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Người dùng - Quản trị DVK Gunpla</title>
  <link rel="icon" href="../assets/images/logo.svg">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body class="admin" data-root="../" data-admin-page="users" data-title="Thêm người dùng" data-crumb="Người dùng / Biểu mẫu">
  <div class="admin-shell">
    <div id="admin-sidebar"></div>
    <div class="admin-main">
      <div id="admin-topbar"></div>
      <main class="admin-content">
        <!-- user-form.html       : THÊM người dùng mới
             user-form.html?id=.. : XEM thông tin người dùng (chỉ xem) -->
        <form class="form-layout" id="user-form" autocomplete="off" novalidate>
          <div class="checkout-stack">
          <section class="card">
            <div class="card-head"><h2 id="form-title"></h2><a class="link" href="users.html">← Quay lại danh sách</a></div>
            <div class="card-pad">
              <div class="form-grid">
                <label class="field"><span>Họ và tên</span><input class="input" id="uf-name" placeholder="Nhập họ và tên"></label>
                <label class="field"><span>Email</span><input class="input" id="uf-email" placeholder="Nhập email"></label>
                <label class="field"><span>Số điện thoại</span><input class="input" id="uf-phone" placeholder="Nhập số điện thoại"></label>
                <label class="field" id="uf-pass-field"><span id="uf-pass-label">Mật khẩu</span><input class="input" id="uf-pass" type="password" placeholder="Nhập mật khẩu"></label>
                <label class="field"><span>Tỉnh / Thành phố</span><select class="select" id="uf-city"></select></label>
                <label class="field"><span>Phường / Xã</span><select class="select" id="uf-ward"></select></label>
                <label class="field full"><span>Số nhà, tên đường</span><input class="input" id="uf-street" placeholder="Vd: 12 Võ Văn Ngân"></label>
              </div>
            </div>
            <div class="sticky-actions" id="form-actions">
              <a class="btn btn-outline" href="users.html" id="uf-cancel">Hủy</a>
              <button class="btn btn-primary" type="submit" id="uf-submit">Thêm người dùng</button>
            </div>
          </section>
          <!-- Lịch sử mua hàng (chỉ có khi xem người dùng) -->
          <section class="card" id="uf-orders" hidden></section>
          </div>
          <aside class="checkout-stack">
            <section class="card">
              <div class="card-head"><h3>Thông tin tài khoản</h3></div>
              <div class="card-pad" id="uf-preview"></div>
            </section>
          </aside>
        </form>
      </main>
    </div>
  </div>

  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/common.js"></script>
  <script>
    if (getParam("id")) { document.body.dataset.title = "Thông tin người dùng"; document.body.dataset.crumb = "Người dùng / Xem"; }
  </script>
  <script src="../assets/js/admin/admin-layout.js"></script>
  <script src="../assets/js/admin/user-form.js"></script>
</body>
</html>
